<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>MY 60 · Сброс PIN</title><style>body{margin:0;padding:24px;background:#f4f3ef;font:16px -apple-system,sans-serif;color:#151917}.card{max-width:410px;margin:6vh auto;background:#fff;border-radius:22px;padding:24px;box-sizing:border-box}input,button{box-sizing:border-box;width:100%;padding:14px;margin:7px 0;border:1px solid #d9ddd7;border-radius:13px;font:inherit}button{background:#151917;color:#fff;border:0;font-weight:700}.status{display:block;min-height:22px;margin-top:12px}</style><main class="card"><h1>MY 60</h1><h2>Новый PIN</h2><p>Старые данные зашифрованы прежним PIN и восстановить их нельзя. Здесь можно создать новый профиль.</p><input id="name" placeholder="Как вас зовут"><input id="pin" type="password" inputmode="numeric" placeholder="Новый PIN, минимум 4 цифры"><input id="start" type="number" placeholder="Стартовый вес, кг"><input id="goal" type="number" placeholder="Целевой вес, кг"><button id="go">Создать новый профиль</button><small id="status" class="status"></small></main><script>const $=x=>document.getElementById(x),t=new TextEncoder(),b=x=>btoa(String.fromCharCode(...new Uint8Array(x)));$("go").onclick=async()=>{let n=$("name").value.trim()||"Моя цель",p=$("pin").value.trim(),s=+$("start").value,g=+$("goal").value,z=$("status");if(p.length<4||!s||!g||g>=s){z.textContent="Проверьте PIN и вес.";return}try{z.textContent="Создаю профиль…";let a=crypto.getRandomValues(new Uint8Array(16)),i=crypto.getRandomValues(new Uint8Array(12)),k=await crypto.subtle.importKey("raw",t.encode(p),"PBKDF2",false,["deriveKey"]),q=await crypto.subtle.deriveKey({name:"PBKDF2",salt:a,iterations:210000,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["encrypt"]),v={profile:{name:n,start:s,goal:g,calories:1500,steps:7000},weights:{},food:{},water:{},steps:{},well:{},measures:{},photos:[],workouts:{},shop:[],notes:[]},d=await crypto.subtle.encrypt({name:"AES-GCM",iv:i},q,t.encode(JSON.stringify(v))),x=JSON.stringify({v:1,salt:b(a),iv:b(i),data:b(d)});localStorage.removeItem("my60-cloud-token");localStorage.setItem("my60-secure",x);location.replace("./")}catch(e){z.textContent="Не удалось создать профиль. Попробуйте ещё раз."}};</script>
