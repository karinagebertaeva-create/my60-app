<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>MY 60 · New PIN</title><style>body{margin:0;padding:24px;background:#f4f3ef;font:16px -apple-system,sans-serif;color:#151917}.card{max-width:410px;margin:6vh auto;background:#fff;border-radius:22px;padding:24px;box-sizing:border-box}input,button{box-sizing:border-box;width:100%;padding:14px;margin:7px 0;border:1px solid #d9ddd7;border-radius:13px;font:inherit}button{background:#151917;color:#fff;border:0;font-weight:700}.status{display:block;min-height:22px;margin-top:12px}</style><main class="card"><h1>MY 60</h1><h2>New PIN</h2><p>Enter your account email and password, then choose a new PIN. Your old encrypted records will be replaced with a new profile.</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Account password"><input id="pin" type="password" inputmode="numeric" placeholder="New PIN, 4+ digits"><input id="start" type="number" placeholder="Starting weight, kg"><input id="goal" type="number" placeholder="Goal weight, kg"><button id="go">Create new profile</button><small id="status" class="status"></small></main><script>const $=x=>document.getElementById(x),t=new TextEncoder(),b=x=>btoa(String.fromCharCode(...new Uint8Array(x)));$('go').onclick=async()=>{let e=$('email').value.trim(),p=$('password').value,n=$('pin').value.trim(),s=+$('start').value,g=+$('goal').value,z=$('status');if(!e||!p||n.length<4||!s||!g||g>=s){z.textContent='Check your details.';return}try{z.textContent='Saving…';let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:e,password:p})}),j=await r.json();if(!r.ok)throw Error(j.error||'Login failed');let a=crypto.getRandomValues(new Uint8Array(16)),i=crypto.getRandomValues(new Uint8Array(12)),k=await crypto.subtle.importKey('raw',t.encode(n),'PBKDF2',false,['deriveKey']),q=await crypto.subtle.deriveKey({name:'PBKDF2',salt:a,iterations:210000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt']),v={profile:{name:'My goal',start:s,goal:g,calories:1500,steps:7000},weights:{},food:{},water:{},steps:{},well:{},measures:{},photos:[],workouts:{},shop:[],notes:[]},d=await crypto.subtle.encrypt({name:'AES-GCM',iv:i},q,t.encode(JSON.stringify(v))),x=JSON.stringify({v:1,salt:b(a),iv:b(i),data:b(d)});r=await fetch('/api/state',{method:'PUT',headers:{'Content-Type':'application/json','Authorization':'Bearer '+j.token},body:JSON.stringify({payload:x})});if(!r.ok)throw Error('Could not save');localStorage.setItem('my60-cloud-token',j.token);localStorage.setItem('my60-secure',x);location.replace('/')}catch(err){z.textContent=err.message||'Try again.'}};</script>
